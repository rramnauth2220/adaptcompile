[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptcompile"
version = "0.1.0"
description = "Represent, measure, and compare the behavioral effects of model adaptation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rebecca Ramnauth" }]
keywords = ["machine-learning", "model-adaptation", "evaluation", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dataframe = ["pandas>=1.5"]
dev = [
    "build>=1.2",
    "mypy>=1.8",
    "pandas>=1.5",
    "pandas-stubs>=1.5",
    "pytest>=7",
    "ruff>=0.4",
    "twine>=5",
]

[project.urls]
Repository = "https://github.com/rramnauth2220/adaptcompile"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptcompile = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["adaptcompile"]
